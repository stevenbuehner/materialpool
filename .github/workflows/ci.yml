name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Keine lokalen Umgebungsdateien im Git-Index
        run: |
          if git ls-files -- .env '.env.*' | grep -vFx '.env.example' | grep -q .; then
            echo 'Eine lokale Umgebungsdatei ist in Git versioniert.' >&2
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick, pdo_mysql, mbstring, xml, zip, gd, intl, bcmath
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf libreoffice ghostscript tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - name: Testkonfiguration
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan passport:keys
          DB_HOST=127.0.0.1 DB_DATABASE=testing DB_USERNAME=root DB_PASSWORD=testing php artisan migrate:fresh --env=testing --force
          DB_HOST=127.0.0.1 DB_DATABASE=testing DB_USERNAME=root DB_PASSWORD=testing php artisan db:seed --env=testing --force
      - run: DB_HOST=127.0.0.1 DB_DATABASE=testing DB_USERNAME=root DB_PASSWORD=testing php artisan test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick, pdo_mysql, mbstring, xml, zip, gd, intl, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: npm run build
      - run: test -s public/build/manifest.json && test ! -e public/hot
