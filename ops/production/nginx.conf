server {
    listen 80;
    listen [::]:80;
    server_name materialpool.example.invalid;

    root /srv/materialpool/current/public;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    index index.php;
    charset utf-8;
    client_max_body_size 100m;

    location ~ ^/material-downloads/(?<download_token>[a-f0-9]{64})\.zip$ {
        alias /srv/materialpool/shared/storage/app/material-downloads/ready/$download_token.zip;
        types { application/zip zip; }
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="Material.zip"' always;
        add_header Cache-Control 'private, no-store' always;
        add_header Referrer-Policy 'no-referrer' always;
        access_log off;
        autoindex off;
    }
    location /material-downloads/ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
