services:
    admin.keyword:
        class: StevenBuehner\MaterialResourceStructureBundle\Admin\KeywordAdmin
        arguments: [~, StevenBuehner\MaterialResourceStructureBundle\Entity\Keyword, ~]
        tags:
            - { name: sonata.admin, manager_type: orm, label: Keywords }

    admin.material:
        class: StevenBuehner\MaterialResourceStructureBundle\Admin\MaterialAdmin
        arguments: [~, StevenBuehner\MaterialResourceStructureBundle\Entity\Material, SonataAdminBundle:CRUD]
        tags:
            - { name: sonata.admin, manager_type: orm, group: admin, label: Material }
