# For more information: https://laravel.com/docs/sail
services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:5173'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            PHP_IDE_CONFIG: "serverName=materialpool"
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            qdrant:
                condition: service_healthy
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            interval: 5s
            retries: 10
            timeout: 5s
    qdrant:
        image: 'qdrant/qdrant:v1.19.1'
        ports:
            - '127.0.0.1:${FORWARD_QDRANT_PORT:-6333}:6333'
        environment:
            QDRANT__SERVICE__API_KEY: '${QDRANT_API_KEY:-local-qdrant-development-key}'
            QDRANT__SERVICE__ENABLE_CORS: 'false'
            QDRANT__TELEMETRY_DISABLED: 'true'
        volumes:
            - 'sail-qdrant:/qdrant/storage'
        networks:
            - sail
        mem_limit: '${QDRANT_MEMORY_LIMIT:-1536m}'
        cpus: '${QDRANT_CPUS:-1.0}'
        healthcheck:
            test: ['CMD-SHELL', 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3''']
            interval: 5s
            retries: 12
            timeout: 3s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-qdrant:
        driver: local
